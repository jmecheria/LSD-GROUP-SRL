<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>LSD Group SRL — Transport Persoane | Curse Regulate & Organizate</title>
<meta name="description" content="Rezervă locuri online pentru curse regulate și organizate în România. Flotă modernă, șoferi autorizați. LSD Group SRL — transport persoane autorizat ARR."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
/* ── RESET & ROOT ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0f0d0a;--bone:#f5f2eb;--cream:#ede8d8;--card:#ffffff;
  --amber:#c49a2a;--amber-d:#a07d1c;--amber-g:rgba(196,154,42,.11);--amber-b:rgba(196,154,42,.25);
  --stone:#8a7f6e;--border:#ddd5be;--border-l:#e8e0ce;
  --green:#1a6b3c;--green-g:rgba(26,107,60,.1);
  --red:#b52d2d;--red-g:rgba(181,45,45,.08);
  --orange:#c46520;--orange-g:rgba(196,101,32,.1);
  --blue:#1e5fa8;--blue-g:rgba(30,95,168,.08);
  --r:10px;--r-lg:16px;--r-xl:20px;
  --sh:0 1px 4px rgba(15,13,10,.08),0 4px 16px rgba(15,13,10,.06);
  --sh-lg:0 4px 24px rgba(15,13,10,.12),0 12px 40px rgba(15,13,10,.08);
  --sh-amber:0 4px 20px rgba(196,154,42,.2);
  --nav-h:60px;--tick-h:34px;
}
html{scroll-behavior:smooth}
body{
  background:var(--bone);color:var(--ink);
  font-family:"Inter",system-ui,sans-serif;font-size:14px;line-height:1.6;
  overflow-x:hidden;min-height:100vh;
}
h1,h2,h3,h4,h5{font-family:"Plus Jakarta Sans",sans-serif;line-height:1.2}
a{color:var(--amber);text-decoration:none;cursor:pointer}
button{cursor:pointer;font-family:"Inter",sans-serif;transition:all .18s ease}
input,select,textarea{
  width:100%;background:var(--card);border:1.5px solid var(--border);color:var(--ink);
  border-radius:var(--r);padding:10px 14px;font-family:"Inter",sans-serif;font-size:13px;
  outline:none;transition:border-color .18s,box-shadow .18s;
}
input:focus,select:focus,textarea:focus{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-g)}
input::placeholder,textarea::placeholder{color:var(--stone)}
select option{background:var(--cream)}

/* ── TICKER ── */
#ticker{
  position:fixed;top:0;left:0;width:100%;height:var(--tick-h);
  background:linear-gradient(135deg,var(--amber),var(--amber-d));
  z-index:1000;overflow:hidden;display:flex;align-items:center;
}
#ticker.hidden{display:none}
.tick-inner{
  display:flex;white-space:nowrap;
  animation:tickScroll 50s linear infinite;
}
.tick-inner:hover{animation-play-state:paused}
.tick-inner span{
  padding:0 56px;font-size:12px;font-weight:600;
  color:rgba(255,255,255,.95);font-family:"Plus Jakarta Sans",sans-serif;letter-spacing:.3px;
}
@keyframes tickScroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ── NAV ── */
#nav{
  position:fixed;top:var(--tick-h);left:0;width:100%;height:var(--nav-h);
  background:rgba(245,242,235,.96);backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--border-l);z-index:999;
  display:flex;align-items:center;padding:0 24px;gap:8px;
}
.nav-logo{
  font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;font-size:17px;
  color:var(--amber);margin-right:auto;cursor:pointer;display:flex;align-items:center;gap:8px;
  letter-spacing:-.3px;
}
.nav-logo-icon{
  width:32px;height:32px;background:linear-gradient(135deg,var(--amber),var(--amber-d));
  border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;
}
#nav-links{display:flex;gap:2px;align-items:center}
.nl{
  padding:7px 11px;border-radius:8px;font-size:13px;font-weight:500;
  color:var(--stone);cursor:pointer;border:none;background:none;
  font-family:"Inter",sans-serif;
}
.nl:hover{color:var(--ink);background:var(--cream)}
.nl.active{color:var(--amber);background:var(--amber-g);font-weight:600}
#nav-actions{display:flex;align-items:center;gap:8px}
.nb{
  padding:8px 16px;border-radius:var(--r);font-size:13px;font-weight:600;
  border:none;font-family:"Inter",sans-serif;
}
.nb-outline{
  background:transparent;border:1.5px solid var(--border);color:var(--ink);
}
.nb-outline:hover{border-color:var(--amber);color:var(--amber)}
.nb-solid{
  background:linear-gradient(135deg,var(--amber),var(--amber-d));color:#fff;
  box-shadow:var(--sh-amber);
}
.nb-solid:hover{background:var(--amber-d);transform:translateY(-1px)}
#notif-bell{
  position:relative;cursor:pointer;width:36px;height:36px;border-radius:8px;
  display:none;align-items:center;justify-content:center;
  font-size:18px;background:var(--cream);border:1px solid var(--border-l);
}
#notif-bell:hover{background:var(--amber-g);border-color:var(--amber-b)}
#notif-badge{
  position:absolute;top:-3px;right:-3px;background:var(--red);color:#fff;
  font-size:9px;font-weight:700;min-width:16px;height:16px;border-radius:8px;
  display:none;align-items:center;justify-content:center;padding:0 3px;
}
#ham-btn{
  display:none;flex-direction:column;gap:5px;background:none;border:none;
  padding:6px;cursor:pointer;
}
#ham-btn span{width:22px;height:2px;background:var(--ink);border-radius:2px;transition:all .2s}
#mob-menu{
  display:none;position:fixed;top:calc(var(--tick-h) + var(--nav-h));
  left:0;width:100%;background:var(--card);
  border-bottom:1px solid var(--border);z-index:998;
  flex-direction:column;gap:2px;padding:8px 12px 12px;
  box-shadow:var(--sh-lg);
}
#mob-menu.open{display:flex}

/* ── APP SHELL ── */
#app{padding-top:calc(var(--tick-h) + var(--nav-h));min-height:100vh}
.page{display:none;max-width:1200px;margin:0 auto;padding:32px 24px}
.page.active{display:block;animation:pgFadeIn .2s ease}
@keyframes pgFadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ── GRIDS ── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.g-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}

/* ── BUTTONS ── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 18px;border-radius:var(--r);font-size:13px;font-weight:600;
  border:none;cursor:pointer;font-family:"Inter",sans-serif;transition:all .18s;
}
.btn-primary{
  background:linear-gradient(135deg,var(--amber),var(--amber-d));color:#fff;
  box-shadow:0 2px 8px rgba(196,154,42,.25);
}
.btn-primary:hover{background:var(--amber-d);transform:translateY(-1px);box-shadow:0 4px 14px rgba(196,154,42,.3)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-secondary{background:var(--card);color:var(--ink);border:1.5px solid var(--border)}
.btn-secondary:hover{border-color:var(--amber);color:var(--amber)}
.btn-danger{background:var(--red-g);color:var(--red);border:1px solid rgba(181,45,45,.2)}
.btn-danger:hover{background:var(--red);color:#fff}
.btn-ghost{background:transparent;color:var(--stone);border:none;padding:6px 10px}
.btn-ghost:hover{color:var(--ink);background:var(--cream)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
.btn-lg{padding:13px 24px;font-size:15px;border-radius:12px}
.btn-full{width:100%}
.btn-icon{width:36px;height:36px;padding:0;border-radius:8px}

/* ── CARDS ── */
.card{
  background:var(--card);border:1px solid var(--border-l);
  border-radius:var(--r-lg);box-shadow:var(--sh);overflow:hidden;
}
.card:hover{border-color:rgba(196,154,42,.3);box-shadow:var(--sh-lg);transform:translateY(-2px)}
.card-pad{padding:20px}
.card-img{
  position:relative;height:180px;background:var(--cream);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.card-img img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.card-img .overlay{
  position:absolute;inset:0;background:linear-gradient(to top,rgba(15,13,10,.4),transparent);
}

/* ── FORM ── */
.fg{margin-bottom:16px}
.fl{
  display:block;font-size:11px;font-weight:600;margin-bottom:5px;
  color:var(--stone);text-transform:uppercase;letter-spacing:.5px;
}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f-hint{font-size:11px;color:var(--stone);margin-top:4px}
.f-err{font-size:11px;color:var(--red);margin-top:3px;display:none}
.f-err.show{display:block}
input.err,select.err,textarea.err{border-color:var(--red)}
input.ok{border-color:var(--green)}

/* ── BADGES / CHIPS ── */
.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;
}
.badge-confirmata{background:var(--green-g);color:var(--green);border:1px solid rgba(26,107,60,.2)}
.badge-in_asteptare{background:var(--orange-g);color:var(--orange);border:1px solid rgba(196,101,32,.25)}
.badge-oferta_trimisa{background:var(--amber-g);color:var(--amber-d);border:1px solid var(--amber-b)}
.badge-anulata{background:var(--red-g);color:var(--red);border:1px solid rgba(181,45,45,.2)}
.chip{
  display:inline-block;background:var(--cream);border:1px solid var(--border);
  color:var(--stone);font-size:11px;padding:3px 9px;border-radius:6px;margin:2px;
}
.chip-amber{background:var(--amber-g);border-color:var(--amber-b);color:var(--amber-d)}
.chip-green{background:var(--green-g);border-color:rgba(26,107,60,.2);color:var(--green)}

/* ── MODAL ── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(15,13,10,.55);z-index:2000;
  display:none;align-items:center;justify-content:center;padding:16px;
  backdrop-filter:blur(3px);
}
.modal-overlay.open{display:flex}
.modal{
  background:var(--card);border-radius:var(--r-xl);box-shadow:var(--sh-lg);
  width:100%;max-height:92vh;overflow-y:auto;
  border:1px solid var(--border-l);
}
.modal-sm{max-width:440px}
.modal-md{max-width:580px}
.modal-lg{max-width:760px}
.modal-xl{max-width:1000px}
.modal-head{
  padding:20px 24px 16px;display:flex;justify-content:space-between;align-items:flex-start;
  position:sticky;top:0;background:var(--card);z-index:10;
  border-bottom:1px solid var(--border-l);
}
.modal-title{font-family:"Plus Jakarta Sans",sans-serif;font-weight:700;font-size:17px}
.modal-sub{font-size:12px;color:var(--stone);margin-top:2px}
.modal-close{
  width:32px;height:32px;border-radius:8px;border:none;background:var(--cream);
  color:var(--stone);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.modal-close:hover{background:var(--border);color:var(--ink)}
.modal-body{padding:20px 24px}
.modal-foot{
  padding:16px 24px;border-top:1px solid var(--border-l);
  display:flex;gap:10px;justify-content:flex-end;
  position:sticky;bottom:0;background:var(--card);
}

/* ── TABS ── */
.tab-bar{
  display:flex;gap:2px;border-bottom:1px solid var(--border-l);
  margin-bottom:24px;overflow-x:auto;scrollbar-width:none;
}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{
  padding:10px 16px;background:none;border:none;border-bottom:2px solid transparent;
  font-size:13px;font-weight:500;color:var(--stone);cursor:pointer;
  font-family:"Inter",sans-serif;white-space:nowrap;margin-bottom:-1px;transition:all .18s;
}
.tab-btn:hover{color:var(--ink)}
.tab-btn.active{color:var(--amber);border-bottom-color:var(--amber);font-weight:600}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* ── TABLE ── */
.tbl{width:100%;border-collapse:collapse}
.tbl th{
  text-align:left;padding:10px 14px;font-size:11px;color:var(--stone);
  border-bottom:1px solid var(--border);font-weight:600;text-transform:uppercase;letter-spacing:.4px;
}
.tbl td{padding:11px 14px;font-size:13px;border-bottom:1px solid var(--border-l);vertical-align:middle}
.tbl tr:hover td{background:var(--amber-g)}
.tbl-wrap{overflow-x:auto;border-radius:var(--r-lg);border:1px solid var(--border-l);background:var(--card)}

/* ── STATS CARD ── */
.stat-card{
  background:var(--card);border:1px solid var(--border-l);border-radius:var(--r-lg);
  padding:20px;text-align:center;box-shadow:var(--sh);
}
.stat-num{
  font-family:"Plus Jakarta Sans",sans-serif;font-size:28px;font-weight:800;
  color:var(--amber);line-height:1.1;margin-bottom:4px;
}
.stat-label{font-size:12px;color:var(--stone)}

/* ── TOGGLE ── */
.toggle{position:relative;display:inline-block;width:42px;height:24px;cursor:pointer}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-track{
  position:absolute;inset:0;background:var(--cream);border-radius:12px;
  border:1.5px solid var(--border);transition:all .2s;
}
.toggle-track::before{
  content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;
  background:var(--stone);border-radius:50%;transition:all .2s;
}
.toggle input:checked+.toggle-track{background:var(--green-g);border-color:var(--green)}
.toggle input:checked+.toggle-track::before{transform:translateX(18px);background:var(--green)}

/* ── SCHEDULE CARD ── */
.sch-card{
  background:var(--card);border:1.5px solid var(--border-l);border-radius:var(--r-lg);
  padding:20px;margin-bottom:14px;transition:border-color .2s,box-shadow .2s;
}
.sch-card:hover{border-color:var(--amber-b);box-shadow:var(--sh)}
.sch-route{
  font-family:"Plus Jakarta Sans",sans-serif;font-weight:700;font-size:19px;margin-bottom:10px;
}
.sch-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--stone);margin-bottom:12px}
.sch-meta span{display:flex;align-items:center;gap:5px}
.sch-meta strong{color:var(--ink)}
.day-dot{
  width:28px;height:28px;border-radius:50%;border:1.5px solid var(--border);
  font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;
  color:var(--stone);margin:2px;
}
.day-dot.active{
  background:var(--amber-g);border-color:var(--amber);color:var(--amber-d);
}
.stop-badge{
  display:inline-flex;align-items:center;gap:6px;background:var(--cream);
  border:1px solid var(--border);border-radius:8px;padding:5px 12px;
  font-size:12px;margin:3px;
}
.stop-badge .stop-price{color:var(--amber-d);font-weight:700}

/* ── SEAT GRID ── */
.seat-wrap{max-width:400px;margin:0 auto}
.seat-front-bar{
  text-align:center;font-size:10px;font-weight:700;color:var(--stone);
  background:var(--cream);border:1px solid var(--border);border-radius:8px 8px 0 0;
  padding:6px;letter-spacing:.8px;text-transform:uppercase;
}
.seat-grid{
  border:1px solid var(--border);border-top:none;border-radius:0 0 12px 12px;
  padding:12px 10px;background:var(--card);display:flex;flex-direction:column;gap:6px;
}
.seat-row{display:flex;align-items:center;justify-content:center;gap:5px}
.seat-row.back{margin-top:6px;padding-top:10px;border-top:1px dashed var(--border)}
.seat-row.driver-row{justify-content:flex-start;padding-left:8px;margin-bottom:4px;padding-bottom:10px;border-bottom:1px solid var(--border);gap:12px}
.seat-aisle{width:22px;flex-shrink:0}
.seat{
  width:40px;height:36px;border-radius:7px 7px 5px 5px;border:1.5px solid var(--border);
  background:var(--cream);cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;transition:all .15s;color:var(--stone);
  position:relative;flex-shrink:0;
}
.seat::after{
  content:"";position:absolute;top:-4px;left:5px;right:5px;height:4px;
  background:inherit;border:1.5px solid inherit;border-radius:3px 3px 0 0;border-bottom:none;
}
.seat.free{background:var(--green-g);border-color:rgba(26,107,60,.35);color:var(--green)}
.seat.free:hover{background:rgba(26,107,60,.2);transform:translateY(-2px);box-shadow:0 4px 10px var(--green-g)}
.seat.occupied{background:var(--red-g);border-color:rgba(181,45,45,.25);color:var(--red);cursor:not-allowed}
.seat.selected{
  background:linear-gradient(135deg,var(--amber),var(--amber-d));border-color:var(--amber);
  color:#fff;transform:translateY(-2px);box-shadow:0 4px 12px rgba(196,154,42,.35);
}
.seat.driver{background:var(--cream);cursor:not-allowed;font-size:16px;border-style:dashed}
.seat.blocked{background:var(--cream);cursor:not-allowed;opacity:.4;border-style:dashed}

/* ── SEAT LEGEND ── */
.seat-legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:12px;color:var(--stone);margin:12px 0}
.seat-legend span{display:flex;align-items:center;gap:5px}
.seat-legend-dot{width:14px;height:13px;border-radius:4px;border:1.5px solid}

/* ── TOAST ── */
#toast-container{
  position:fixed;bottom:24px;right:24px;z-index:9999;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;
}
.toast{
  background:var(--card);border:1px solid var(--border-l);border-radius:var(--r-lg);
  padding:12px 16px;min-width:260px;max-width:340px;
  display:flex;align-items:center;gap:10px;font-size:13px;
  box-shadow:var(--sh-lg);animation:toastIn .25s ease;pointer-events:all;
}
.toast-ok{border-left:3px solid var(--green)}
.toast-er{border-left:3px solid var(--red)}
.toast-in{border-left:3px solid var(--amber)}
.toast-wr{border-left:3px solid var(--orange)}
@keyframes toastIn{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ── SPINNER ── */
.spin{
  display:inline-block;width:18px;height:18px;
  border:2px solid var(--border);border-top-color:var(--amber);
  border-radius:50%;animation:spin .65s linear infinite;vertical-align:middle;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-state{text-align:center;padding:60px 24px;color:var(--stone)}
.loading-state .spin{width:32px;height:32px;border-width:3px;margin-bottom:14px}

/* ── EMPTY STATE ── */
.empty-state{text-align:center;padding:60px 24px;color:var(--stone)}
.empty-icon{font-size:48px;margin-bottom:14px;opacity:.7}
.empty-state h3{font-size:16px;color:var(--ink);margin-bottom:8px}

/* ── SECTION HEADER ── */
.sec-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.sec-title{font-family:"Plus Jakarta Sans",sans-serif;font-weight:700;font-size:22px}
.sec-sub{color:var(--stone);font-size:13px;margin-top:3px}

/* ── HERO ── */
.hero{
  text-align:center;padding:64px 0 48px;
}
.hero-eyebrow{
  display:inline-block;background:var(--amber-g);border:1px solid var(--amber-b);
  color:var(--amber-d);padding:6px 18px;border-radius:20px;
  font-size:12px;font-weight:700;letter-spacing:.5px;margin-bottom:22px;
}
.hero h1{
  font-size:clamp(2rem,5vw,3.6rem);font-weight:800;line-height:1.08;margin-bottom:18px;
  letter-spacing:-.02em;
}
.hero h1 .grad{
  background:linear-gradient(135deg,var(--amber),var(--amber-d));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.hero-sub{color:var(--stone);font-size:16px;max-width:500px;margin:0 auto 40px;line-height:1.65}
.hero-cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:56px}

/* ── BUS CARD (flotă homepage) ── */
.bus-card{
  background:var(--card);border:1.5px solid var(--border-l);border-radius:var(--r-lg);
  overflow:hidden;cursor:pointer;transition:all .22s;
}
.bus-card:hover{border-color:var(--amber-b);box-shadow:var(--sh-lg);transform:translateY(-3px)}
.bus-card-img{
  position:relative;height:190px;background:var(--cream);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.bus-card-img img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;display:none}
.bus-card-img img.visible{display:block}
.bus-card-img .bus-icon{font-size:60px;position:relative;z-index:1}
.bus-card-img .img-nav{
  position:absolute;top:50%;transform:translateY(-50%);
  display:flex;justify-content:space-between;width:100%;padding:0 6px;z-index:5;
  pointer-events:none;
}
.bus-card-img .img-nav.visible{pointer-events:all}
.img-nav-btn{
  width:28px;height:28px;border-radius:50%;background:rgba(15,13,10,.5);
  border:none;color:#fff;font-size:13px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.img-dots{position:absolute;bottom:8px;right:8px;display:flex;gap:4px}
.img-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35);cursor:pointer}
.img-dot.active{background:var(--amber)}
.bus-card-body{padding:16px}
.bus-card-name{font-family:"Plus Jakarta Sans",sans-serif;font-weight:700;font-size:15px;margin-bottom:6px}
.bus-card-meta{font-size:12px;color:var(--stone);margin-bottom:10px;display:flex;gap:12px;flex-wrap:wrap}
.bus-card-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.bus-card-link{font-size:12px;color:var(--amber);font-weight:600}

/* ── PROFIL ── */
.profile-avatar{
  width:64px;height:64px;border-radius:50%;
  background:linear-gradient(135deg,var(--amber),var(--amber-d));
  display:flex;align-items:center;justify-content:center;
  font-size:26px;font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;color:#fff;
  flex-shrink:0;
}

/* ── MESSAGE BUBBLES ── */
.msg-thread{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;max-height:240px;overflow-y:auto}
.msg-bubble{border-radius:10px;padding:10px 14px;font-size:13px;max-width:86%}
.msg-admin{background:var(--amber-g);border:1px solid var(--amber-b);margin-left:auto}
.msg-client{background:var(--cream);border:1px solid var(--border)}
.msg-meta{font-size:10px;color:var(--stone);margin-bottom:3px}

/* ── DRIVER PORTAL ── */
.driver-card{
  background:var(--card);border:1.5px solid var(--border-l);
  border-radius:var(--r-xl);margin-bottom:24px;overflow:hidden;box-shadow:var(--sh);
}
.driver-card-head{
  background:linear-gradient(135deg,var(--amber-g),rgba(196,154,42,.04));
  border-bottom:1px solid var(--border-l);padding:18px 22px;
  display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;
}
.driver-route{font-family:"Plus Jakarta Sans",sans-serif;font-weight:700;font-size:19px}
.pax-card{
  background:var(--cream);border:1px solid var(--border);border-radius:10px;
  padding:12px 14px;display:flex;justify-content:space-between;
  align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px;
}
.pax-seat{
  background:linear-gradient(135deg,var(--amber),var(--amber-d));
  color:#fff;font-weight:800;font-size:12px;padding:3px 10px;border-radius:6px;
}

/* ── TIMELINE ADMIN ── */
.tl-wrap{overflow-x:auto;border:1px solid var(--border-l);border-radius:var(--r-lg);background:var(--card);box-shadow:var(--sh)}
.tl-grid{min-width:960px;position:relative}
.tl-header{display:flex;border-bottom:2px solid var(--border);background:var(--cream);position:sticky;top:0;z-index:10}
.tl-rowlabel{width:175px;min-width:175px;flex-shrink:0;padding:8px 14px;border-right:2px solid var(--border);font-size:10px;font-weight:700;color:var(--stone);text-transform:uppercase;letter-spacing:.4px}
.tl-hours{flex:1;display:flex}
.tl-hcell{flex:1;text-align:center;font-size:10px;color:var(--stone);padding:7px 2px;border-right:1px solid var(--border-l);min-width:38px}
.tl-hcell.now-col{color:var(--amber-d);font-weight:700;background:var(--amber-g)}
.tl-row{display:flex;border-bottom:1px solid var(--border-l);min-height:58px;position:relative;transition:background .15s}
.tl-row:hover{background:var(--amber-g)}
.tl-label{width:175px;min-width:175px;flex-shrink:0;padding:8px 12px;border-right:2px solid var(--border);display:flex;flex-direction:column;justify-content:center;gap:3px}
.tl-lname{font-weight:700;font-size:12px;color:var(--ink)}
.tl-lsub{font-size:10px;color:var(--stone)}
.tl-ore-bar{height:4px;background:var(--cream);border-radius:2px;overflow:hidden;width:90px;margin-top:3px}
.tl-ore-fill{height:100%;border-radius:2px;transition:width .3s}
.tl-track{
  flex:1;position:relative;
  background:repeating-linear-gradient(90deg,transparent,transparent calc(100%/22 - 1px),var(--border-l) calc(100%/22 - 1px),var(--border-l) calc(100%/22));
}
.tl-block{
  position:absolute;top:7px;bottom:7px;border-radius:7px;cursor:pointer;
  display:flex;align-items:center;padding:0 8px;font-size:11px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:filter .15s,transform .1s;
  border:1.5px solid;user-select:none;
}
.tl-block:hover{filter:brightness(1.08);transform:translateY(-1px);z-index:5}
.tl-block[draggable=true]{cursor:grab}
.tl-block[draggable=true]:active{cursor:grabbing;opacity:.7}
.tl-block.b-normal{background:var(--amber-g);border-color:var(--amber);color:#7a5c00}
.tl-block.b-return{background:rgba(196,154,42,.06);border-color:rgba(196,154,42,.35);color:#8b6500;border-style:dashed}
.tl-block.b-break{background:rgba(100,100,100,.08);border-color:rgba(150,150,150,.3);color:var(--stone)}
.tl-block.b-warn{background:var(--orange-g);border-color:var(--orange);color:#7c3200}
.tl-block.b-unset{background:rgba(200,200,200,.1);border-color:rgba(180,180,180,.35);border-style:dashed;color:var(--stone)}
.tl-block.b-veh{background:var(--blue-g);border-color:rgba(30,95,168,.3);color:var(--blue);font-size:10px}
.tl-block.b-conflict{background:var(--red-g);border-color:var(--red);color:var(--red)}
.tl-block.b-handover{background:var(--green-g);border-color:var(--green);color:#0f4f25;border-left:3px solid var(--green)}
.tl-nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:8;pointer-events:none}
.tl-nowline::before{content:"";position:absolute;top:-4px;left:-4px;width:10px;height:10px;background:var(--red);border-radius:50%}

/* ── ASSIGN PANEL ── */
.assign-panel{
  position:fixed;z-index:9999;background:var(--card);
  border:2px solid var(--amber);border-radius:var(--r-lg);
  box-shadow:0 8px 40px rgba(15,13,10,.18);padding:18px;width:310px;max-width:calc(100vw - 20px);
}
.assign-sf-select{
  width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;
  font-size:13px;background:var(--card);font-family:"Inter",sans-serif;outline:none;
}
.assign-sf-select:focus{border-color:var(--amber)}

/* ── SEAT BUILDER (admin) ── */
.sb-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;background:var(--cream);border-radius:8px;padding:10px 12px}
.sb-label{font-size:12px;color:var(--stone);width:64px;flex-shrink:0}
.sb-seats{display:flex;gap:5px;flex:1;flex-wrap:wrap}
.seat-mini{
  width:28px;height:26px;border-radius:5px;border:1px solid var(--border);
  background:var(--bone);display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:600;color:var(--stone);
}
.seat-mini.used{background:var(--amber-g);border-color:var(--amber-b);color:var(--amber-d)}

/* ── INVOICE ── */
.invoice{font-family:"Inter",sans-serif;max-width:680px;margin:0 auto}
.invoice-header{
  display:flex;justify-content:space-between;align-items:flex-start;
  margin-bottom:28px;padding-bottom:20px;border-bottom:2px solid var(--amber);flex-wrap:wrap;gap:12px;
}
.invoice-logo{font-family:"Plus Jakarta Sans",sans-serif;font-size:20px;font-weight:800;color:var(--amber-d);margin-bottom:6px}
.invoice-parties{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:24px}
.invoice-party{border:1.5px solid var(--border-l);border-radius:var(--r);padding:14px}
.invoice-party-title{font-size:10px;font-weight:700;color:var(--stone);text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--border-l);padding-bottom:6px;margin-bottom:10px}
.invoice-tbl{width:100%;border-collapse:collapse;margin-bottom:20px}
.invoice-tbl th{background:var(--cream);padding:9px 12px;font-size:11px;color:var(--stone);font-weight:700;text-transform:uppercase;letter-spacing:.4px;border:1px solid var(--border-l)}
.invoice-tbl td{padding:10px 12px;border:1px solid var(--border-l);font-size:13px;vertical-align:top}
.invoice-totals{margin-left:auto;width:300px}
.invoice-total-row{display:flex;justify-content:space-between;padding:9px 14px;font-size:13px;border-bottom:1px solid var(--border-l)}
.invoice-total-row.final{
  background:linear-gradient(135deg,var(--amber-g),rgba(196,154,42,.06));
  font-size:16px;font-weight:800;border-bottom:none;border-radius:0 0 var(--r) var(--r);
}

/* ── CALENDAR ── */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-hday{text-align:center;font-size:10px;font-weight:700;color:var(--stone);text-transform:uppercase;padding:4px}
.cal-day{
  border-radius:8px;padding:6px 4px;min-height:54px;font-size:10px;
  border:1px solid transparent;position:relative;cursor:default;
}
.cal-day.today{border-color:var(--amber)}
.cal-day.has-event{background:var(--card);border-color:var(--border-l);box-shadow:var(--sh)}
.cal-day.free{background:var(--bone);opacity:.6}
.cal-day-nr{font-weight:700;font-size:12px;margin-bottom:3px;text-align:center;color:var(--stone)}
.cal-day.has-event .cal-day-nr{color:var(--ink)}
.cal-event{border-radius:3px;padding:1px 5px;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.cal-event.reg{background:var(--amber-g);color:var(--amber-d)}
.cal-event.org{background:var(--orange-g);color:var(--orange)}

/* ── QR SCANNER ── */
#html5-qrcode-reader{border-radius:10px;overflow:hidden;border:1.5px solid var(--border-l);min-height:200px;background:var(--cream)}

/* ── COOKIE BANNER ── */
#cookie-banner{
  position:fixed;bottom:0;left:0;right:0;background:var(--card);
  border-top:1px solid var(--border-l);box-shadow:0 -4px 20px rgba(15,13,10,.08);
  padding:14px 24px;display:flex;align-items:center;justify-content:space-between;
  gap:14px;z-index:5000;font-size:13px;
}
#cookie-banner.hidden{display:none}

/* ── FOOTER ── */
footer{
  background:#1a1511;border-top:none;
  margin-top:48px;
}
.footer-inner{max-width:1200px;margin:0 auto;padding:48px 24px 24px}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:40px;margin-bottom:40px;padding-bottom:32px;border-bottom:1px solid rgba(255,255,255,.08)}
.footer-brand{font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;font-size:18px;color:var(--amber);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.footer-desc{font-size:12px;color:rgba(255,255,255,.45);line-height:1.8}
.footer-col-title{font-size:11px;font-weight:700;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px}
.footer-col a,.footer-col span{display:block;font-size:13px;color:rgba(255,255,255,.45);margin-bottom:6px;cursor:pointer}
.footer-col a:hover{color:var(--amber)}
.footer-anpc{
  display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center;
  padding:14px;background:rgba(255,255,255,.04);border-radius:10px;border:1px solid rgba(255,255,255,.06);
  margin-bottom:20px;
}
.anpc-badge{
  display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.55);font-size:12px;font-weight:600;
}
.anpc-badge .badge-pill{
  background:rgba(196,154,42,.25);border:1px solid rgba(196,154,42,.4);
  color:var(--amber);padding:4px 10px;border-radius:6px;font-weight:700;font-size:11px;
}
.footer-bottom{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;font-size:11px;color:rgba(255,255,255,.3)}

/* ── MISC ── */
.divider{height:1px;background:var(--border-l);margin:20px 0}
.info-box{
  background:var(--amber-g);border:1px solid var(--amber-b);border-radius:var(--r);
  padding:12px 14px;font-size:12px;color:var(--amber-d);margin-bottom:12px;
}
.info-box-blue{background:var(--blue-g);border-color:rgba(30,95,168,.2);color:var(--blue)}
.pbar{height:5px;background:var(--cream);border-radius:3px;overflow:hidden;margin-top:5px}
.pbar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--amber),var(--amber-d));transition:width .3s}
#lightbox{
  position:fixed;inset:0;background:rgba(15,13,10,.82);z-index:9000;
  display:none;align-items:center;justify-content:center;
}
#lightbox.open{display:flex}
#lightbox img{max-width:90vw;max-height:90vh;border-radius:var(--r)}
#lightbox-close{
  position:absolute;top:16px;right:16px;background:rgba(255,255,255,.12);
  border:none;color:#fff;width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer;
}
.drop-zone{
  border:2px dashed var(--border);border-radius:var(--r-lg);padding:24px;
  text-align:center;cursor:pointer;transition:border-color .2s;
}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--amber)}
.img-preview-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.img-preview-item{position:relative;width:72px;height:72px}
.img-preview-item img{width:100%;height:100%;object-fit:cover;border-radius:8px;cursor:pointer}
.img-preview-del{
  position:absolute;top:-6px;right:-6px;background:var(--red);border:none;color:#fff;
  width:20px;height:20px;border-radius:50%;font-size:11px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
/* ── RESPONSIVE ── */
@media(max-width:900px){.footer-grid{grid-template-columns:1fr 1fr}}
@media(max-width:700px){
  #nav-links,#nav-actions{display:none}
  #ham-btn{display:flex}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .f-row{grid-template-columns:1fr}
  .page{padding:20px 16px}
  .footer-grid{grid-template-columns:1fr}
  #nav{padding:0 16px}
  .invoice-parties{grid-template-columns:1fr}
}
@media(max-width:480px){.page{padding:16px 12px}}
</style>
